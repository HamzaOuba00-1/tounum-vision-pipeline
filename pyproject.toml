[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tounum-vision-pipeline"
version = "1.0.0"
description = "Deep-learning pipeline for scanned archives: photo classification, denoising and image captioning."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Chloé Armand" },
  { name = "Hamza Ouba" },
  { name = "Ylies Chaouche" },
  { name = "Enzo Fraioli" },
]
keywords = ["deep-learning", "cnn", "autoencoder", "image-captioning", "transfer-learning", "tensorflow"]
dependencies = [
  "tensorflow>=2.16",
  "keras>=3.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "pillow>=10.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "nltk>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
tounum = "tounum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["N803", "N806"]  # W1 / W2 / V attention matrices keep their paper names

[tool.ruff.lint.isort]
known-first-party = ["tounum"]
